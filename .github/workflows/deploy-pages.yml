name: Deploy GitHub Pages

on:
  push:
    branches: [main, feature/visual-polish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          GITHUB_PAGES: "true"
          VITE_BASE: /
          # Live Stripe Payment Link (semi-public buy button). Not a secret.
          VITE_STRIPE_PAYMENT_LINK: https://buy.stripe.com/7sY8wR0jHgGh8FWbFF6Vq00
          # GA4 Measurement ID (G-…). Empty until Stefanie adds repo secret VITE_GA_MEASUREMENT_ID.
          # See docs/analytics.md — never hardcode a fake ID; unset keeps gtag unloaded.
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
