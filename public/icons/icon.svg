<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PocketMemoir">
  <!-- Soft Storybook cream tile; content kept inside ~80% for maskable -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3a2430" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c9d4"/>
      <stop offset="55%" stop-color="#c9dfd0"/>
      <stop offset="100%" stop-color="#f0e2b8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#fff3df"/>
  <!-- faint paper grain dots -->
  <g fill="#e8d5b8" opacity="0.55">
    <circle cx="78" cy="92" r="3"/><circle cx="430" cy="110" r="2.5"/><circle cx="96" cy="420" r="2.8"/>
    <circle cx="448" cy="400" r="3"/><circle cx="120" cy="180" r="2"/><circle cx="400" cy="300" r="2"/>
  </g>
  <!-- sage washi strip (back) -->
  <g transform="rotate(-18 256 256)">
    <rect x="96" y="168" width="320" height="36" rx="6" fill="#9fbfa8" stroke="#3a2430" stroke-width="8"/>
    <g stroke="#fff3df" stroke-width="3" opacity="0.55">
      <line x1="112" y1="176" x2="112" y2="196"/><line x1="136" y1="176" x2="136" y2="196"/>
      <line x1="160" y1="176" x2="160" y2="196"/><line x1="184" y1="176" x2="184" y2="196"/>
      <line x1="208" y1="176" x2="208" y2="196"/><line x1="232" y1="176" x2="232" y2="196"/>
      <line x1="256" y1="176" x2="256" y2="196"/><line x1="280" y1="176" x2="280" y2="196"/>
      <line x1="304" y1="176" x2="304" y2="196"/><line x1="328" y1="176" x2="328" y2="196"/>
      <line x1="352" y1="176" x2="352" y2="196"/><line x1="376" y1="176" x2="376" y2="196"/>
      <line x1="400" y1="176" x2="400" y2="196"/>
    </g>
  </g>
  <!-- polaroid -->
  <g filter="url(#soft)" transform="rotate(8 256 270)">
    <rect x="148" y="150" width="216" height="260" rx="14" fill="#fffcf5" stroke="#3a2430" stroke-width="10"/>
    <rect x="170" y="172" width="172" height="172" rx="8" fill="url(#photo)" stroke="#3a2430" stroke-width="7"/>
    <!-- tiny kawaii face in the photo -->
    <circle cx="230" cy="248" r="7" fill="#3a2430"/>
    <circle cx="282" cy="248" r="7" fill="#3a2430"/>
    <path d="M236 278c12 16 40 16 52 0" fill="none" stroke="#3a2430" stroke-width="7" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="214" cy="268" r="8" fill="#f4a0b0" opacity="0.7"/>
    <circle cx="298" cy="268" r="8" fill="#f4a0b0" opacity="0.7"/>
    <!-- caption lines -->
    <line x1="178" y1="368" x2="280" y2="368" stroke="#d4b896" stroke-width="8" stroke-linecap="round"/>
    <line x1="178" y1="386" x2="240" y2="386" stroke="#e0c9a8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- soft pink washi on top corner -->
  <g transform="rotate(22 340 160)">
    <rect x="286" y="132" width="130" height="28" rx="5" fill="#e8a0b0" stroke="#3a2430" stroke-width="7"/>
  </g>
  <!-- tiny heart sticker -->
  <g transform="translate(360 350)">
    <path d="M0 10c-8-14 10-28 22-14 12-14 30 0 22 14C36 26 22 40 11 48 0 40-14 26 0 10z" fill="#9b2d4a" stroke="#3a2430" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
